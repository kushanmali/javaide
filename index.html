<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Java IDE that compiles and runs code entirely in your browser using WebAssembly." />
    <title>Java IDE</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e76f00'/><text x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'>{J}</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- CheerpJ: Java Virtual Machine compiled to WebAssembly -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">{J}</span>
          <span class="brand-name">Java IDE</span>
          <span class="file-name" id="file-name">Main.java</span>
        </div>

        <div class="actions">
          <button class="btn btn-run" id="run-button" type="button" disabled title="Compile and run (Ctrl+Enter)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
            <span>Run</span>
          </button>
          <button class="btn btn-stop" id="stop-button" type="button" disabled title="Stop the running program">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" /></svg>
            <span>Stop</span>
          </button>
          <span class="divider" aria-hidden="true"></span>
          <label class="select-wrap" title="Load an example program">
            <span class="visually-hidden">Examples</span>
            <select id="example-select">
              <option value="">Examples…</option>
            </select>
          </label>
          <button class="btn btn-ghost" id="download-button" type="button" title="Download source file">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13h10" /></svg>
            <span class="label-optional">Download</span>
          </button>
          <button class="btn btn-ghost btn-icon" id="theme-button" type="button" title="Toggle light/dark theme" aria-label="Toggle theme">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 1.5v10a5 5 0 0 1 0-10z" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace" id="workspace">
        <section class="editor-pane" aria-label="Code editor">
          <div id="editor" class="editor"></div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize panels" tabindex="0"></div>

        <section class="bottom-pane" id="bottom-pane">
          <div class="tabs" role="tablist">
            <button class="tab is-active" role="tab" aria-selected="true" data-panel="console-panel" id="console-tab" type="button">Console</button>
            <button class="tab" role="tab" aria-selected="false" data-panel="problems-panel" id="problems-tab" type="button">
              Problems <span class="badge" id="problems-badge" hidden>0</span>
            </button>
            <div class="tabs-spacer"></div>
            <button class="btn btn-ghost btn-small" id="clear-button" type="button" title="Clear console">Clear</button>
          </div>

          <div class="panel console-scroller" id="console-panel" role="tabpanel">
            <div class="console" id="console-output" aria-live="polite"></div>
          </div>

          <div class="panel problems" id="problems-panel" role="tabpanel" hidden>
            <p class="empty" id="problems-empty">No problems. Compile errors and warnings appear here.</p>
            <ul class="problem-list" id="problem-list"></ul>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="status" id="status"><span class="dot"></span><span id="status-text">Loading Java runtime…</span></span>
        <span class="status-right">
          <span id="timing"></span>
          <span id="cursor">Ln 1, Col 1</span>
          <!-- Credit required by the free CheerpJ Community licence -->
          <span>Java 8 · <a class="credit" href="https://cheerpj.com" target="_blank" rel="noopener noreferrer" title="Runs on CheerpJ 4.3, a WebAssembly JVM by Leaning Technologies">CheerpJ by Leaning Technologies</a></span>
        </span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
